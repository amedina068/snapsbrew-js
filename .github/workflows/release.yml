# Publishes the package to npm with trusted publishing (OIDC). The job
# gets a short-lived token from GitHub. The repository has no npm secret.
# This workflow runs only when a maintainer starts it by hand. It does not
# run on a push or a tag.
#
# Before the first release:
# 1. On npmjs.com, add a trusted publisher to the package: owner amedina068,
#    repository snapsbrew-js, workflow release.yml, environment npm.
# 2. Start this workflow from the Actions tab. Leave "dry-run" on for a test.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack the package, but do not publish it.
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm CLI 11.5.1 or later.
      - name: Install npm 11.21.2
        run: npm install --global npm@11.21.2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - name: Stop when there is no license
        run: node -e "if (!require('./package.json').license) { console.error('Set a license in package.json first.'); process.exit(1) }"
      - name: Publish
        run: npm publish --provenance --access public ${{ inputs.dry-run && '--dry-run' || '' }}
