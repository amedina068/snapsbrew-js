name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: publint and Are the Types Wrong
        run: npm run check:package
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  test:
    name: Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The build tools need Node 22. On Node 20, npm prints an engine
      # warning for them and installs them. Vitest runs on Node 20.
      - run: npm ci
      - run: npm test
        env:
          SNAPSBREW_TEST_URL: ${{ secrets.SNAPSBREW_TEST_URL }}
          SNAPSBREW_TEST_TOKEN: ${{ secrets.SNAPSBREW_TEST_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Smoke test of the build (ESM and CJS)
        run: npm run smoke:node

  bun:
    name: Bun smoke test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: bun smoke/esm.mjs

  deno:
    name: Deno smoke test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: deno run --allow-read smoke/esm.mjs
