name: Feature request
description: Ask for a new feature or a change in the SDK.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the task that you cannot do now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change. Give an example of the code that you want to write.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other solutions that you tried.
  - type: input
    id: endpoint
    attributes:
      label: API endpoint
      description: If the request is about an endpoint, give its method and path.
      placeholder: POST /v1/snaps
